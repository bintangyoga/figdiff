name: Format run (temporary)
on:
  push:
    branches: [format-run]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: git diff > format.patch; wc -l format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
