name: Format run (temporary)
on:
  push:
    branches: [format-run]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b format-result
          git commit -am "Apply Prettier" || echo "nothing to format"
          git push -f origin format-result
