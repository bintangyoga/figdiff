name: Release

# Publishes to npm when a version tag such as v0.1.0 or v0.1.0-alpha.0 is pushed.
# Requires the repository secret NPM_TOKEN (see RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          # Versions like 0.1.0-alpha.0 go under the "alpha" tag, not "latest".
          TAG=latest
          case "$GITHUB_REF_NAME" in
            *-*) TAG=$(echo "$GITHUB_REF_NAME" | sed -E 's/^[^-]*-([A-Za-z]+).*/\1/') ;;
          esac
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
            exit 0
          fi
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $FLAGS
        env:
          GH_TOKEN: ${{ github.token }}
