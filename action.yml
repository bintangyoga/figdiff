name: figdiff
description: Comment on pull requests with what changed in your FigCraft (.figcraft) design files.
author: bintangyoga
branding:
  icon: git-pull-request
  color: purple

inputs:
  files:
    description: Which design files to look at. Glob patterns separated by commas or new lines.
    default: "**/*.figcraft"
  token:
    description: "Token used to post the comment. The default needs the pull-requests: write permission."
    default: ${{ github.token }}
  comment:
    description: Set to "false" to skip the comment and only write the reports.
    default: "true"
  max-files:
    description: Compare at most this many files per pull request.
    default: "20"
  upload-reports:
    description: Upload the HTML reports as a workflow artifact named figdiff-reports.
    default: "true"
  images:
    description: "Render before/after images into the HTML reports. Experimental: downloads figcraft-cli from the latest FigCraft release."
    default: "false"
  scale:
    description: Render scale for the images, from 0.25 to 4.
    default: "1"
  tolerance:
    description: "Ignore number changes up to this size in design nodes (for example 0.5), so sub-pixel changes from re-measured text do not show up. Empty means exact."
    default: ""
  host-images:
    description: "With images: also show them in the comment by saving them to a branch of this repository. Needs contents: write permission. Anyone who can read the repository can see the images."
    default: "false"
  assets-branch:
    description: Branch that holds the saved images.
    default: figdiff-assets
  report-dir:
    description: Folder, relative to the workspace, where the HTML reports are written.
    default: figdiff-reports
  version:
    description: Version of the figdiff npm package to use.
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install figdiff
      shell: bash
      env:
        FIGDIFF_VERSION: ${{ inputs.version }}
      run: npm install --prefix "$RUNNER_TEMP/figdiff" --no-audit --no-fund "figdiff@$FIGDIFF_VERSION"
    - name: Install figcraft-cli
      if: ${{ inputs.images == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/figcraft"
        gh release download --repo storytold/figcraft --pattern '*linux-x86_64.tar.gz' --dir "$RUNNER_TEMP/figcraft" \
          || echo "::warning::Could not download FigCraft; the reports will have no images."
        for f in "$RUNNER_TEMP"/figcraft/*.tar.gz; do [ -f "$f" ] && tar -xzf "$f" -C "$RUNNER_TEMP/figcraft"; done
        CLI=$(find "$RUNNER_TEMP/figcraft" -type f -name figcraft-cli | head -n 1)
        if [ -n "$CLI" ]; then chmod +x "$CLI"; echo "FIGCRAFT_CLI=$CLI" >> "$GITHUB_ENV"; else echo "::warning::figcraft-cli was not found in the FigCraft release."; fi
    - name: Compare design files
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_UPLOAD_REPORTS: ${{ inputs.upload-reports }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_HOST_IMAGES: ${{ inputs.host-images }}
        INPUT_ASSETS_BRANCH: ${{ inputs.assets-branch }}
        INPUT_SCALE: ${{ inputs.scale }}
        INPUT_TOLERANCE: ${{ inputs.tolerance }}
        GITHUB_TOKEN: ${{ inputs.token }}
        FIGDIFF_VERSION: ${{ inputs.version }}
      run: |
        ENTRY="$RUNNER_TEMP/figdiff/node_modules/figdiff/dist/action.js"
        if [ ! -f "$ENTRY" ]; then
          echo "::error::figdiff@$FIGDIFF_VERSION does not include the GitHub Action. Use a version of 0.1.0-alpha.2 or later (input 'version')."
          exit 1
        fi
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        node "$ENTRY"
    - name: Upload reports
      if: ${{ inputs.upload-reports != 'false' && hashFiles(format('{0}/*.html', inputs.report-dir)) != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: figdiff-reports
        path: ${{ inputs.report-dir }}
